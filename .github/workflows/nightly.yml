name: Nightly
on:
  workflow_dispatch:
  schedule:
    - cron: "00 02 * * 2-5" # 2:00 am Tuesday thru Friday

permissions:
  contents: read
  # Needed for workload identity federation
  id-token: write

jobs:
  # Run On-demand Tests
  on-demand:
    name: Run On-demand Tests
    permissions:
      contents: read
      id-token: write
      # Required by verible_lint job, even though it doesn't run
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Build non-PQC CW340 bitstream
  chip_egret_cw340:
    name: Egret for CW340
    uses: ./.github/workflows/bitstream.yml
    secrets: inherit
    with:
      top_name: egret
      design_suffix: cw340

  # Hyper310 nightly FPGA jobs
  execute_nightly_tests_egret_cw310:
    name: Egret CW310 Nightly Tests
    needs: on-demand
    if: success() || failure()
    uses: ./.github/workflows/egret-cw310-nightly.yml
    secrets: inherit
    with:
      bitstream: chip_egret_cw310_hyperdebug

  # CW340 nightly FPGA jobs
  execute_nightly_tests_egret_cw340:
    name: Egret CW340 Nightly Tests
    needs:
      - on-demand
      - chip_egret_cw340
    if: success() || failure()
    uses: ./.github/workflows/egret-cw340-nightly.yml
    secrets: inherit
    with:
      bitstream: chip_egret_cw340

  # DVSim nightly
  #dvsim-all:
  #  name: All nightly DVSim coverage simulation
  #  uses: ./.github/workflows/dv-all.yml
  #  secrets: inherit
  #  with:
  #    item: "nightly"
  #    run-type: "nightly"
  #    coverage: true
  #    timeout-minutes: 2880 # 48 hours
  #    dashboard-private: "git@github.com:pavona/internal-dashboard.git"
  #    dashboard-public: "git@github.com:pavona/public-dashboard.git"
  #    concurrent-jobs: 30

  # Resiliator RTL fault-injection campaign against the Egret Ibex core with
  # the lockstep shadow core enabled.
  resiliator_egret_ibex:
    name: Egret Ibex Fault-Injection Campaign
    runs-on:
      group: pavona-large
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/actions/prepare-env
      - name: Run fault-injection campaign
        id: campaign
        run: ./ci/scripts/run-resiliator-campaign.sh egret
      - name: Upload campaign results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.campaign.outputs.results != '' }}
        with:
          name: resiliator-egret-ibex-results
          path: ${{ steps.campaign.outputs.results }}
          if-no-files-found: ignore
