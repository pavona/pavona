<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 7287 4406">
  <style>
    .panel { fill: #d9d2e9; stroke: #674ea7; stroke-width: 16; }
    .mem { fill: #fce5cd; stroke: #783f04; stroke-width: 16; }
    .arrow { stroke: #351c75; stroke-width: 24; }
    .head { fill: #351c75; stroke: #351c75; stroke-width: 24; }
    text { font-family: Roboto, Arial, sans-serif; }
    .title { font-size: 191px; font-weight: bold; fill: #351c75; text-anchor: middle; }
    .heading { font-size: 161px; fill: #783f04; text-anchor: middle; }
    .step { font-size: 161px; fill: #000000; }
    .code { font-family: "Roboto Mono", monospace; font-size: 107px; fill: #666666; white-space: pre; }
    .comment { fill: #999999; }
    .label { fill: #b45f06; }
    .insn { fill: #434343; }
  </style>

  <rect class="panel" x="31" y="16" width="2336" height="4361"/>
  <rect class="panel" x="4919" y="16" width="2336" height="4361"/>
  <text class="title" x="1199" y="376">Ibex</text>
  <text class="title" x="6087" y="377">ACC</text>

  <path class="arrow" d="M2358 684H4763"/>
  <path class="head" d="M4763 724l109 -40l-109 -40z"/>
  <path class="arrow" d="M2369 1403H4773"/>
  <path class="head" d="M4773 1442l109 -40l-109 -40z"/>
  <path class="arrow" d="M2377 2131H4781"/>
  <path class="head" d="M4781 2170l109 -40l-109 -40z"/>
  <path class="arrow" d="M2521 2875H4925"/>
  <path class="head" d="M2521 2835l-109 40l109 40z"/>
  <path class="arrow" d="M2521 3603H4925"/>
  <path class="head" d="M2521 3563l-109 40l109 40z"/>
  <path class="arrow" d="M2377 4283H4781"/>
  <path class="head" d="M4781 4322l109 -40l-109 -40z"/>

  <text class="step" x="2480" y="389">(1) Ibex copies an application</text>
  <text class="step" x="2480" y="581">into ACC&#8217;s memories.</text>
  <text class="step" x="2480" y="1116">(2) Ibex writes input data to</text>
  <text class="step" x="2480" y="1308">ACC&#8217;s data memory.</text>
  <text class="step" x="2480" y="1839">(3) Ibex tells ACC to start</text>
  <text class="step" x="2480" y="2031">executing.</text>
  <text class="step" x="2480" y="2566">(4) ACC finishes executing and</text>
  <text class="step" x="2480" y="2758">sends Ibex an interrupt.</text>
  <text class="step" x="2480" y="3312">(5) Ibex reads results from</text>
  <text class="step" x="2480" y="3504">ACC&#8217;s data memory.</text>
  <text class="step" x="2480" y="3983">(6) Ibex tells ACC to wipe its</text>
  <text class="step" x="2480" y="4175">memories, clearing the results.</text>

  <rect class="mem" x="138" y="629" width="2091" height="1523"/>
  <text class="heading" x="1184" y="791">Instruction memory</text>
  <text class="code" x="271" y="1010">acc_load_app(foo);</text>
  <text class="code" x="271" y="1138">acc_dmem_write(x, input_x);</text>
  <text class="code" x="271" y="1266">acc_dmem_write(y, input_y);</text>
  <text class="code" x="271" y="1394">acc_execute();</text>
  <text class="code comment" x="271" y="1522">// wait until done...</text>
  <text class="code" x="271" y="1650">acc_busy_wait_for_done();</text>
  <text class="code" x="271" y="1778">acc_dmem_read(&amp;z, output_z);</text>
  <text class="code" x="271" y="1906">acc_dmem_sec_wipe();</text>
  <text class="code" x="271" y="2034">acc_imem_sec_wipe();</text>

  <rect class="mem" x="146" y="2325" width="2091" height="1864"/>
  <text class="heading" x="1192" y="2487">Data memory</text>
  <text class="code label" x="200" y="2666">_foo_imem_start:</text>
  <text class="code comment" x="200" y="2794">// acc binary...</text>
  <text class="code label" x="200" y="3050">_foo_dmem_data_start:</text>
  <text class="code comment" x="200" y="3178">// stored constants</text>
  <text class="code" x="200" y="3306">_foo_speed_of_light 0x11de784a</text>
  <text class="code label" x="200" y="3562">_foo_dmem_bss_start:</text>
  <text class="code comment" x="200" y="3690">// in/out buffer offsets</text>
  <text class="code" x="200" y="3818">_foo_input_x: 0x00</text>
  <text class="code" x="200" y="3946">_foo_input_y: 0x20</text>
  <text class="code" x="200" y="4074">_foo_output_z: 0x60</text>

  <rect class="mem" x="5038" y="636" width="2091" height="1523"/>
  <text class="heading" x="6083" y="799">Instruction memory (IMEM)</text>
  <text class="code comment" x="5112" y="962">/* call a function */</text>
  <text class="code insn" x="5112" y="1090">jal     x1, do_calculation</text>
  <text class="code comment" x="5112" y="1346">/* store 512b result */</text>
  <text class="code" x="5112" y="1474">la      x2, output_z</text>
  <text class="code" x="5112" y="1602">bn.sid  x10, 0(x2++)</text>
  <text class="code" x="5112" y="1730">bn.sid  x11, 0(x2)</text>
  <text class="code comment" x="5112" y="1986">/* end program */</text>
  <text class="code" x="5112" y="2114">ecall</text>

  <rect class="mem" x="5046" y="2292" width="2091" height="1864"/>
  <text class="heading" x="6091" y="2455">Data memory (DMEM)</text>
  <text class="code label" x="5178" y="2674">.data</text>
  <text class="code" x="5178" y="2802">speed_of_light:</text>
  <text class="code" x="5178" y="2930">  .word 0x11de784a</text>
  <text class="code label" x="5178" y="3186">.bss</text>
  <text class="code" x="5178" y="3314">input_x:</text>
  <text class="code" x="5178" y="3442">  .zero 32</text>
  <text class="code" x="5178" y="3570">input_y:</text>
  <text class="code" x="5178" y="3698">  .zero 64</text>
  <text class="code" x="5178" y="3826">output_z:</text>
  <text class="code" x="5178" y="3954">  .zero 64</text>
</svg>
